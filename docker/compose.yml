#
# Local stack: Postgres plus the SeatRota image.
# The image defaults to the published tag. It exists after the v0.1.0 tag is pushed.
#   cp docker/seatrota.env.example docker/seatrota.env
#   docker pull ghcr.io/seatrota/seatrota:v0.1.0
#   docker compose -f docker/compose.yml up
# Build from this tree instead:
#   SEATROTA_IMAGE=seatrota:local docker compose -f docker/compose.yml up --build
name: seatrota

services:
  database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: seatrota
      POSTGRES_PASSWORD: seatrota
      POSTGRES_DB: seatrota
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatrota"]
      interval: 5s
      timeout: 5s
      retries: 20

  seatrota:
    image: ${SEATROTA_IMAGE:-ghcr.io/seatrota/seatrota:v0.1.0}
    pull_policy: missing
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        NEXT_PUBLIC_WEBAPP_URL: ${NEXT_PUBLIC_WEBAPP_URL:-http://localhost:3000}
    env_file: seatrota.env
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  database:
