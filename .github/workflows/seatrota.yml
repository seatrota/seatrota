name: SeatRota

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  HUSKY: "0"
  # Any job that runs a full `yarn build` needs this heap. No pull_request
  # job in this workflow runs that build. The manual dev-boot smoke below
  # inherits it for `yarn dev`.
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  teams:
    name: Lint, type-check, unit, clean-room
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The clean-room check finds the snapshot commit by message.
          # A depth-1 checkout does not contain it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable the repository package manager
        run: corepack enable

      - name: Install
        run: |
          set -euo pipefail
          # @prisma/engines postinstall downloads a binary and can abort with
          # ECONNRESET. Retry the immutable install before failing the job.
          for attempt in 1 2 3; do
            if yarn install --immutable; then
              exit 0
            fi
            echo "yarn install failed (attempt ${attempt})"
            if [[ "${attempt}" -eq 3 ]]; then
              exit 1
            fi
            sleep 15
          done

      - name: Lint teams packages
        run: yarn biome lint packages/teams-core packages/teams-scheduling packages/teams-booking packages/teams-workflows packages/teams-insights packages/teams-sso packages/teams-billing

      - name: Type-check teams packages
        run: yarn type-check --filter='@seatrota/*'

      - name: Unit tests
        run: yarn workspace @seatrota/teams-core test

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Clean-room check
        run: bash scripts/cleanroom-check.sh

      - name: Clean-room self-test
        run: bash scripts/cleanroom-selftest.sh

  # Full `yarn install` plus `yarn dev` of the web app is too heavy for every
  # pull request. Run it by hand. GitHub-hosted runners provide Docker.
  # The job starts packages/prisma/docker-compose.yml, waits for HTTP 200,
  # then stops Postgres and the dev server.
  dev-boot-smoke:
    name: Dev boot smoke (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable the repository package manager
        run: corepack enable

      - name: Boot smoke
        run: bash scripts/dev-boot-smoke.sh

  teams-e2e:
    name: Teams core e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: calendso
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/calendso
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/calendso
      NEXTAUTH_SECRET: seatrota-ci-nextauth-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_WEBAPP_URL: http://localhost:3000
      NEXT_PUBLIC_WEBSITE_URL: http://localhost:3000
      CALENDSO_ENCRYPTION_KEY: seatrota-ci-encryption-key-32b
      NEXT_PUBLIC_IS_E2E: "1"
      PLAYWRIGHT_HEADLESS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable the repository package manager
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Build the web app
        run: yarn build

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium

      - name: Playwright teams-core e2e
        run: yarn playwright test apps/web/playwright/teams-core.e2e.ts --project=@calcom/web --workers=1
