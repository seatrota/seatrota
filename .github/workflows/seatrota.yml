name: SeatRota

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  HUSKY: "0"
  # Any job that runs a full `yarn build` needs this heap. No pull_request
  # job in this workflow runs that build. The manual dev-boot smoke below
  # inherits it for `yarn dev`.
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  teams:
    name: Lint, type-check, unit, clean-room
    # Pinned: ubuntu-latest is 26.04, and Playwright 1.57 has no Chromium build for it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The clean-room check finds the snapshot commit by message.
          # A depth-1 checkout does not contain it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable the repository package manager
        run: corepack enable

      - name: Install
        run: |
          set -euo pipefail
          # @prisma/engines postinstall downloads a binary and can abort with
          # ECONNRESET. Retry the immutable install before failing the job.
          for attempt in 1 2 3; do
            if yarn install --immutable; then
              exit 0
            fi
            echo "yarn install failed (attempt ${attempt})"
            if [[ "${attempt}" -eq 3 ]]; then
              exit 1
            fi
            sleep 15
          done

      - name: Lint teams packages
        run: yarn biome lint packages/teams-core packages/teams-scheduling packages/teams-booking packages/teams-workflows packages/teams-insights packages/teams-sso packages/teams-billing

      - name: Type-check teams packages
        run: yarn type-check --filter='@seatrota/*'

      - name: Unit tests
        run: |
          yarn workspace @seatrota/teams-core test
          yarn workspace @seatrota/teams-sso test
          yarn workspace @seatrota/teams-scheduling test
          yarn workspace @seatrota/teams-workflows test
          yarn workspace @seatrota/teams-insights test
          yarn workspace @seatrota/teams-billing test

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Clean-room check
        run: bash scripts/cleanroom-check.sh

      - name: Clean-room self-test
        run: bash scripts/cleanroom-selftest.sh

  # Full `yarn install` plus `yarn dev` of the web app is too heavy for every
  # pull request. Run it by hand. GitHub-hosted runners provide Docker.
  # The job starts packages/prisma/docker-compose.yml, waits for HTTP 200,
  # then stops Postgres and the dev server.
  dev-boot-smoke:
    name: Dev boot smoke (manual)
    if: github.event_name == 'workflow_dispatch'
    # Pinned: ubuntu-latest is 26.04, and Playwright 1.57 has no Chromium build for it.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable the repository package manager
        run: corepack enable

      - name: Boot smoke
        run: bash scripts/dev-boot-smoke.sh

  teams-e2e:
    name: Teams core e2e
    # Pinned: ubuntu-latest is 26.04, and Playwright 1.57 has no Chromium build for it.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: calendso
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/calendso
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/calendso
      NEXTAUTH_SECRET: seatrota-ci-nextauth-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_WEBAPP_URL: http://localhost:3000
      NEXT_PUBLIC_WEBSITE_URL: http://localhost:3000
      CALENDSO_ENCRYPTION_KEY: abcdefghijklmnopqrstuvwxyz123456
      KEYCLOAK_URL: http://127.0.0.1:8080
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      CRON_API_KEY: seatrota-ci-cron-key
      SEATROTA_BILLING_ENABLED: "1"
      STRIPE_SECRET_KEY: sk_test_seatrotaci
      SEATROTA_STRIPE_WEBHOOK_SECRET: whsec_seatrota_ci
      SEATROTA_STRIPE_SEAT_PRICE_ID: price_seatrota_ci
      NEXT_PUBLIC_IS_E2E: "1"
      PLAYWRIGHT_HEADLESS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable the repository package manager
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      # Started early so Keycloak is ready by the time the SSO spec runs.
      # See the sso-keycloak job for why this is docker run, not a service.
      - name: Start Keycloak
        run: |
          docker run -d --name keycloak \
            -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            quay.io/keycloak/keycloak:26.0.7 \
            start-dev

      - name: Build the web app
        run: yarn build

      - name: Apply database migrations
        run: yarn workspace @calcom/prisma prisma migrate deploy

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium

      - name: Playwright teams-core e2e
        run: yarn playwright test apps/web/playwright/teams-core.e2e.ts --project=@calcom/web --workers=1

      - name: Playwright scheduling e2e
        run: yarn playwright test apps/web/playwright/teams-scheduling.e2e.ts --project=@calcom/web --workers=1

      - name: Playwright reminder workflows e2e
        run: yarn playwright test apps/web/playwright/teams-workflows.e2e.ts --project=@calcom/web --workers=1

      - name: Playwright insights e2e
        run: yarn playwright test apps/web/playwright/teams-insights.e2e.ts --project=@calcom/web --workers=1

      - name: Playwright billing e2e (Stripe test-mode webhooks)
        run: yarn playwright test apps/web/playwright/teams-billing.e2e.ts --project=@calcom/web --workers=1

      - name: Playwright SSO e2e (Keycloak browser login)
        run: yarn playwright test apps/web/playwright/teams-sso.e2e.ts --project=@calcom/web --workers=1

      - name: Keycloak log on failure
        if: failure()
        run: docker logs keycloak | tail -200

  docker-image:
    name: Docker image
    # Pinned: ubuntu-latest is 26.04; keep every SeatRota job on 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build the SeatRota image
        run: docker build -f docker/Dockerfile -t seatrota:ci .

      - name: Refuse a live Stripe key at startup
        run: |
          set +e
          out=$(docker run --rm --entrypoint node \
            -e DATABASE_URL=postgresql://x@localhost/x -e NEXTAUTH_SECRET=x \
            -e CALENDSO_ENCRYPTION_KEY=abcdefghijklmnopqrstuvwxyz123456 \
            -e NEXT_PUBLIC_WEBAPP_URL=http://localhost:3000 \
            -e SEATROTA_BILLING_ENABLED=1 -e STRIPE_SECRET_KEY=sk_live_notreal \
            -e SEATROTA_STRIPE_WEBHOOK_SECRET=whsec_x -e SEATROTA_STRIPE_SEAT_PRICE_ID=price_x \
            seatrota:ci /app/.seatrota/check-env.js 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -ne 0
          echo "$out" | grep -q "live key"

      - name: Start Postgres and the image
        run: |
          docker network create seatrota
          docker run -d --name database --network seatrota \
            -e POSTGRES_USER=seatrota -e POSTGRES_PASSWORD=seatrota -e POSTGRES_DB=seatrota postgres:16
          for i in $(seq 1 30); do docker exec database pg_isready -U seatrota && break; sleep 2; done
          docker run -d --name seatrota --network seatrota -p 3000:3000 \
            -e DATABASE_URL=postgresql://seatrota:seatrota@database:5432/seatrota \
            -e DATABASE_DIRECT_URL=postgresql://seatrota:seatrota@database:5432/seatrota \
            -e NEXTAUTH_SECRET=seatrota-ci-nextauth-secret \
            -e CALENDSO_ENCRYPTION_KEY=abcdefghijklmnopqrstuvwxyz123456 \
            -e NEXT_PUBLIC_WEBAPP_URL=http://localhost:3000 -e NEXTAUTH_URL=http://localhost:3000 \
            -e CRON_API_KEY=seatrota-ci-cron-key \
            seatrota:ci

      - name: Smoke-test the running container
        run: |
          for i in $(seq 1 90); do
            # An empty database redirects to first-run setup, so follow redirects.
            code=$(curl -sL -o /dev/null -w '%{http_code}' http://localhost:3000/auth/login || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          echo "login page (after redirects): $code, landed on $(curl -sL -o /dev/null -w '%{url_effective}' http://localhost:3000/auth/login)"
          test "$code" = "200"
          cron=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/cron/teams-reminders)
          echo "cron without key: $cron"
          test "$cron" = "401"
          keyed=$(curl -s -X POST -H "authorization: seatrota-ci-cron-key" http://localhost:3000/api/cron/teams-reminders)
          echo "cron with key: $keyed"
          echo "$keyed" | grep -q '"sent":0'
          docker exec database psql -U seatrota -d seatrota -tAc             "select count(*) from information_schema.tables where table_name like 'teams_%'"

      - name: Container logs
        if: always()
        run: docker logs seatrota 2>&1 | tail -200 || true

  upstream-sync-dry-run:
    name: Upstream sync dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone calcom/cal.diy (shallow, public)
        run: git clone -q --shallow-since=2026-04-16 --no-tags https://github.com/calcom/cal.diy.git "$RUNNER_TEMP/cal.diy"

      - name: Replay the patch queue on the recorded snapshot (must be clean)
        env:
          UPSTREAM_MIRROR: ${{ runner.temp }}/cal.diy
        run: |
          current="$(sed -n 's/^- SHA: //p' UPSTREAM.md | head -n 1)"
          bash scripts/upstream-sync.sh --dry-run --report "$RUNNER_TEMP/sync-current.md" "$current"
          cat "$RUNNER_TEMP/sync-current.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Replay the patch queue on upstream main (report only)
        continue-on-error: true
        env:
          UPSTREAM_MIRROR: ${{ runner.temp }}/cal.diy
        run: |
          set +e
          bash scripts/upstream-sync.sh --dry-run --report "$RUNNER_TEMP/sync-latest.md" main
          status=$?
          cat "$RUNNER_TEMP/sync-latest.md" >> "$GITHUB_STEP_SUMMARY" || true
          echo "dry run against upstream main exited $status (3 means a patch needs a manual rebase)"
          exit "$status"

      - name: Upstream sync script rejects bad input
        env:
          UPSTREAM_MIRROR: ${{ runner.temp }}/cal.diy
        run: |
          set +e
          bash scripts/upstream-sync.sh >/dev/null 2>&1; test $? -eq 1 || exit 1
          bash scripts/upstream-sync.sh --dry-run not-a-real-ref-0000 >/dev/null 2>&1; test $? -eq 1 || exit 1
          echo "usage and unknown-ref errors exit 1"

  quickstart:
    name: Quickstart (fresh clone)
    # Runs docs/QUICKSTART.md from a fresh clone of this commit, then drives
    # first-run setup, a first team and the SSO panel in a browser.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the browser driver for the first-team check
        working-directory: ${{ runner.temp }}
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
          echo "QUICKSTART_NODE_DIR=${{ runner.temp }}" >> "$GITHUB_ENV"
          echo "QUICKSTART_SCREENSHOT=${{ github.workspace }}/quickstart-failure.png" >> "$GITHUB_ENV"

      # Until v0.1.0 is tagged the registry has no image, so build this commit
      # under the name the guide pulls. The guide's docker pull then finds it
      # locally; the registry pull itself is checked after the tag is pushed.
      - name: Build the image the guide pulls
        run: docker build -f docker/Dockerfile -t ghcr.io/seatrota/seatrota:v0.1.0 .

      - name: Run docs/QUICKSTART.md
        env:
          QUICKSTART_DOWN: "1"
        run: bash scripts/quickstart-smoke.sh "$RUNNER_TEMP/quickstart"

      - name: Run the README quickstart
        env:
          QUICKSTART_DOC: README.md
        run: bash scripts/quickstart-smoke.sh "$RUNNER_TEMP/readme"

      - name: Stack logs
        if: always()
        run: docker compose -f "$RUNNER_TEMP/readme/seatrota/docker/compose.yml" logs --tail 150 || docker compose -f "$RUNNER_TEMP/quickstart/seatrota/docker/compose.yml" logs --tail 150 || true

      - name: Keep the failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quickstart-failure
          path: quickstart-failure.png
          if-no-files-found: ignore

  sso-keycloak:
    name: OIDC e2e (Keycloak)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: calendso
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/calendso
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/calendso
      CALENDSO_ENCRYPTION_KEY: abcdefghijklmnopqrstuvwxyz123456
      KEYCLOAK_URL: http://127.0.0.1:8080
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable the repository package manager
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      # GitHub Actions service containers cannot pass Keycloak's start-dev
      # command (actions/runner#2139). The production image command refuses
      # HTTP, so the job starts the Keycloak container itself and the test
      # imports packages/teams-sso/e2e/realm-seatrota.json over the admin API.
      - name: Start Keycloak
        run: |
          docker run -d --name keycloak \
            -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -e KEYCLOAK_ADMIN=admin \
            -e KEYCLOAK_ADMIN_PASSWORD=admin \
            quay.io/keycloak/keycloak:26.0.7 \
            start-dev

      - name: Apply database migrations
        run: yarn workspace @calcom/prisma prisma migrate deploy

      - name: Keycloak SSO e2e
        run: yarn workspace @seatrota/teams-sso test:e2e
